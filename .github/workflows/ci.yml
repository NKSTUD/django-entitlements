name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv build

  sqlite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { python: "3.10", django: "4.2" }
          - { python: "3.11", django: "5.2" }
          - { python: "3.12", django: "5.2" }
          - { python: "3.13", django: "6.0" }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --with "django~=${{ matrix.django }}.0" python -m django test --settings=tests.settings tests
      - run: uv run --with "django~=${{ matrix.django }}.0" python -m django makemigrations --check --dry-run --settings=tests.settings entitlements

  postgres:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        django: ["4.2", "5.2", "6.0"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE: postgres
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run --with "django~=${{ matrix.django }}.0" python -m django test --settings=tests.settings tests -v 2
