[project]
name = "django-entitlements"
version = "0.1.0"
description = "Plans, quotas and credits for Django: who can use what, and how many times. Works with any billing provider."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nouhan Kourouma" }]
requires-python = ">=3.10"
keywords = ["django", "entitlements", "quotas", "credits", "subscriptions", "saas", "billing", "usage", "metering", "plans"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = ["django>=4.2"]

[project.urls]
Homepage = "https://github.com/NKSTUD/django-entitlements"
Issues = "https://github.com/NKSTUD/django-entitlements/issues"
Changelog = "https://github.com/NKSTUD/django-entitlements/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.4,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "entitlements"

[dependency-groups]
dev = [
    "psycopg[binary]>=3.2",
    "ruff>=0.17.0",
    "time-machine>=2.16",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*/migrations", "*.md"]  # README examples are aligned by hand

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "DJ"]
ignore = ["RUF012"]  # Django declares Meta, admin and choices as class-level lists
